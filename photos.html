:root{color-scheme:dark;--bg:#101014;--surface:#1b1b21;--ink:#f6f3f3;--muted:#9997a1;--line:#ffffff19}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% -30%,#4e334233,transparent 55%);z-index:-1}
button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1460px,calc(100% - 64px));margin:auto}
header{padding:72px 0 32px}.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#e4afbf;font-weight:700}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.hero h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.065em;font-size:clamp(54px,8vw,105px);line-height:1;margin:14px 0 12px}.hero h1 i{color:#e4afbf;font-weight:400}.sub{color:var(--muted);font-size:15px}.pill{border:1px solid var(--line);border-radius:99px;padding:11px 16px;background:#ffffff08;color:#ddd;white-space:nowrap}
.toolbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(22px);background:#101014d9;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0}.tools strong{font-weight:500;color:#d8d5dc}.search{display:flex;align-items:center;gap:10px;background:#ffffff09;border:1px solid var(--line);border-radius:11px;padding:0 13px;width:min(330px,65vw)}.search input{height:38px;background:none;color:white;border:0;outline:0;width:100%;min-width:0}.search input::placeholder{color:#777580}
main{padding:20px 0 40px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.photo{position:relative;aspect-ratio:4/4.6;border-radius:13px;overflow:hidden;background:linear-gradient(130deg,#26242d,#19191f);border:1px solid #ffffff0b;isolation:isolate}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,filter .4s ease}.photo:hover img{transform:scale(1.045);filter:brightness(.82)}.photo .open{position:absolute;inset:0;border:0;background:transparent;color:transparent;width:100%;height:100%;cursor:zoom-in}.photo .bottom{position:absolute;inset:auto 0 0;display:flex;justify-content:flex-end;align-items:end;gap:10px;padding:34px 13px 13px;background:linear-gradient(transparent,#000b);opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}.photo:hover .bottom,.photo:focus-within .bottom{opacity:1;transform:none}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;text-shadow:0 1px 4px #000;max-width:calc(100% - 50px)}.dl{pointer-events:auto;border:1px solid #ffffff50;background:#f6f3f3;color:#141217;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 4px 20px #0004;transition:.2s}.dl:hover{background:#e7b5c5;transform:translateY(-2px)}.dl svg{width:17px;height:17px}
.status{padding:90px 20px;text-align:center;color:var(--muted);font-size:15px}.status a{color:#e4afbf}
.viewer{position:fixed;inset:0;z-index:50;background:#09090cf7;display:none;flex-direction:column}.viewer.show{display:flex}.vtop{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:15px;border-bottom:1px solid var(--line)}.vname{max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:10px}.vbtn{border:1px solid #ffffff2a;background:#ffffff12;color:white;border-radius:10px;padding:10px 14px}.vbtn:hover{background:#ffffff25}.vbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px}.vbody img{max-height:calc(100vh - 125px);max-width:calc(100vw - 170px);object-fit:contain;border-radius:5px}.arrow{font-size:30px;border:0;background:none;color:#fff9;padding:16px}.arrow:hover{color:white}
footer{color:#777580;font-size:12px;text-align:center;padding:0 0 32px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{width:calc(100% - 28px)}header{padding-top:48px}.hero h1{font-size:58px}.hero{align-items:flex-start}.hero .pill{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{border-radius:9px}.photo .bottom{opacity:1;transform:none;padding:26px 8px 8px}.dl{width:31px;height:31px}.vtop{padding:0 12px}.vbody{gap:0;padding:4px}.vbody img{max-width:calc(100vw - 84px)}.arrow{padding:7px;font-size:24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
