<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/woahhcrackers/RaldiWeb-LEGACY/">
  <meta charset="utf-8">
  <title>Raldi's Crackhouse</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-container {
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script src="TemplateData/BALDI.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");

    const DATA_PART_SIZE = 19900000;
    const DATA_PART_COUNT = 11;
    const DATA_TOTAL_SIZE = 207643159;

    const statusEl = document.createElement("div");
    statusEl.style.cssText = "position:fixed;left:0;right:0;top:45%;text-align:center;color:#fff;font:16px monospace;z-index:10;";
    document.body.appendChild(statusEl);

    async function loadPart(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Failed to fetch " + url + " (HTTP " + res.status + ")");
      return res.arrayBuffer();
    }

    async function loadDataParts() {
      const urls = [];
      for (let i = 1; i <= DATA_PART_COUNT; i++) urls.push("Build/BALDI.data.part" + i);

      const buffers = new Array(urls.length);
      let loaded = 0;
      await Promise.all(urls.map(async (url, i) => {
        buffers[i] = await loadPart(url);
        loaded++;
        statusEl.textContent = "Loading data... " + Math.round(loaded / urls.length * 100) + "%";
      }));

      const blob = new Blob(buffers, { type: "application/octet-stream" });
      if (blob.size !== DATA_TOTAL_SIZE) {
        throw new Error("Data size mismatch: expected " + DATA_TOTAL_SIZE + " bytes, got " + blob.size);
      }
      return URL.createObjectURL(blob);
    }

    loadDataParts().then(dataUrl => {
      statusEl.remove();
      createUnityInstance(canvas, {
        dataUrl: dataUrl,
        frameworkUrl: "Build/BALDI.framework.js",
        codeUrl: "Build/BALDI.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Unknown",
        productName: "BALDI",
        productVersion: "1.0"
      });
    }).catch(err => {
      statusEl.textContent = "Failed to load game data: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
