<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/nawsif/host@baec8a7a378b17584cfb9e1851855236ac81cd3d/ROUNDS/">
  <script src="https://tinklehost.github.io/intro.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#414141">
  <title>ROUNDS | Tinkle Games</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #414141;
    }

    #unity-container, #unity-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #unity-container { overflow: hidden; }

    #unity-canvas {
      background: #151515;
      outline: 0;
      touch-action: none;
    }

    #web-start {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #02041b;
      color: #f49812;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #web-start h1 {
      font-size: clamp(42px,9vw,72px);
      letter-spacing: 4px;
      margin: 0 0 24px;
    }

    #web-play {
      padding: 15px 70px;
      background: #f49812;
      color: #02041b;
      border: 0;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
    }

    #web-start p { color: #ddd; }

    #tinkle-loader {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: #414141;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      color: #f6cb68;
      transition: opacity .7s ease, visibility .7s ease;
      font-family: 'Orbitron', Arial, sans-serif;
    }

    #tinkle-loader.fading {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .tinkle-diamond {
      width: 48px;
      height: 48px;
      border: 3px solid #efbd47;
      transform: rotate(45deg);
      box-shadow: 0 0 18px #dca12877;
      animation: diamond-pulse 1.5s ease-in-out infinite;
      margin: 0 0 12px;
    }

    @keyframes diamond-pulse {
      0%, 100% { opacity: .55; scale: .9; }
      50% { opacity: 1; scale: 1.1; }
    }

    .tinkle-title {
      font-weight: 900;
      font-size: clamp(27px,6vw,53px);
      letter-spacing: .1em;
      background: linear-gradient(180deg,#fff2af 0%,#f6c55d 40%,#b97613 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tinkle-track {
      width: min(365px,80vw);
      height: 10px;
      border: 1px solid #d6a538;
      background: #252525;
      border-radius: 15px;
      overflow: hidden;
      margin-top: 8px;
    }

    #tinkle-progress {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg,#b67a19,#ffdf70);
      transition: width .17s linear;
      box-shadow: 0 0 12px #ffdc6d;
    }

    #tinkle-percent {
      font-size: 15px;
      letter-spacing: .15em;
      color: #ffcf65;
    }

    #tinkle-status {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #dedede;
      max-width: 85vw;
      overflow-wrap: anywhere;
    }

    #retry-button {
      display: none;
      border: 1px solid #d6a538;
      border-radius: 4px;
      background: #352a18;
      color: #ffdc6d;
      font: 700 14px Arial, sans-serif;
      padding: 11px 24px;
      cursor: pointer;
    }

    #unity-warning {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(700px,95vw);
      color: white;
      font: 14px Arial, sans-serif;
      pointer-events: none;
    }

    #unity-warning > div {
      padding: 12px;
      border-radius: 6px;
      background: #962d28;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="web-start">
      <h1>ROUNDS</h1>
      <button id="web-play">PLAY</button>
      <p>Ported by zaddy</p>
    </div>

    <div id="tinkle-loader" role="status" aria-live="polite">
      <div class="tinkle-diamond"></div>
      <div class="tinkle-track">
        <div id="tinkle-progress"></div>
      </div>
      <div id="tinkle-percent">0%</div>
      <div id="tinkle-status">Preparing game...</div>
      <button id="retry-button" type="button">RETRY</button>
    </div>

    <div id="unity-warning"></div>
  </div>

  
<script>
(() => {
  const OriginalWebSocket = window.WebSocket;

  window.WebSocket = class extends OriginalWebSocket {
    constructor(url, protocols) {
      const original = String(url);
      let destination = original;

      try {
        const parsed = new URL(original);

        if (
          parsed.protocol === "wss:" &&
          (
            parsed.hostname.endsWith(".exitgames.com") ||
            parsed.hostname === "exitgames.com" ||
            parsed.hostname.endsWith(".photonengine.com") ||
            parsed.hostname === "photonengine.com"
          )
        ) {
          const proxy = new URL(
            "/__rounds_photon/",
            window.location.origin
          );

          proxy.protocol =
            location.protocol === "https:" ? "wss:" : "ws:";

          proxy.searchParams.set("host", parsed.hostname);
          proxy.searchParams.set(
            "path",
            parsed.pathname
          );

          for (const [key, value] of parsed.searchParams) {
            proxy.searchParams.append(key, value);
          }

          destination = proxy.href;

          console.log(
            "[ROUNDS Photon Proxy]",
            parsed.hostname,
            "→",
            destination
          );
        }
      } catch (error) {
        console.warn("[ROUNDS] WebSocket URL error:", error);
      }

      if (protocols === undefined) {
        super(destination);
      } else {
        super(destination, protocols);
      }
    }
  };
})();
</script>

  <script>
  (() => {
    "use strict";

    const REVISION =
      "baec8a7a378b17584cfb9e1851855236ac81cd3d";

    const CDN_ROOT =
      `https://cdn.jsdelivr.net/gh/nawsif/host@${REVISION}/ROUNDS/`;

    const RAW_ROOT =
      `https://raw.githubusercontent.com/nawsif/host/${REVISION}/ROUNDS/`;

    const BUILD_PATH = "Build/";

    const MAX_CONCURRENT = 1;
    const MAX_ATTEMPTS = 2;
    const REQUEST_TIMEOUT = 45000;

    const canvas = document.getElementById("unity-canvas");
    const loader = document.getElementById("tinkle-loader");
    const bar = document.getElementById("tinkle-progress");
    const percent = document.getElementById("tinkle-percent");
    const status = document.getElementById("tinkle-status");
    const retryButton = document.getElementById("retry-button");
    const warnings = document.getElementById("unity-warning");

    const parts = [
      ...["aa","ab","ac","ad","ae","af"].map(s => ({
        name: `WebBuild.data.part-${s}`,
        kind: "data"
      })),
      ...["aa","ab","ac","ad","ae"].map(s => ({
        name: `WebBuild.wasm.part-${s}`,
        kind: "wasm"
      }))
    ];

    const loadedParts = new Map();
    const blobUrls = [];
    const controllers = new Set();

    let lastProgress = 0;
    let running = false;
    let completed = false;
    let unityStarted = false;
    let preferredSource = 0;

    const delay = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    function progress(value, message) {
      lastProgress = Math.max(
        lastProgress,
        Math.min(100, value)
      );

      bar.style.width = lastProgress + "%";
      percent.textContent = Math.floor(lastProgress) + "%";

      if (message) status.textContent = message;
    }

    function warning(message, type = "error") {
      const div = document.createElement("div");
      div.textContent = message;

      if (type === "warning") {
        div.style.background = "#9b740d";
      }

      warnings.appendChild(div);

      if (type !== "error") {
        setTimeout(() => div.remove(), 5000);
      }
    }

    function sources(path) {
  const localPath = path.replace(/^\/+/, "");

  return [
    new URL(
      "/__rounds_assets/" + localPath,
      window.location.origin
    ).href
  ];
}

    function cacheBust(url) {
      const u = new URL(url);
      u.searchParams.set("_attempt", Date.now().toString());
      return u.href;
    }

    async function fetchOnce(url, responseType, timeout) {
      const controller = new AbortController();
      controllers.add(controller);

      const timer = setTimeout(
        () => controller.abort(),
        timeout
      );

      try {
        const response = await fetch(url, {
          method: "GET",
          mode: "cors",
          credentials: "omit",
          redirect: "follow",
          signal: controller.signal,
          cache: "default"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        if (response.type === "opaque") {
          throw new Error("Opaque response cannot be read");
        }

        const contentType =
          response.headers.get("content-type") || "";

        if (responseType === "blob") {
          const blob = await response.blob();

          if (!blob.size) {
            throw new Error("Empty binary response");
          }

          // Detect common error pages masquerading as binary files.
          if (
            contentType.includes("text/html") ||
            contentType.includes("application/json")
          ) {
            throw new Error(
              `Unexpected response type: ${contentType}`
            );
          }

          return blob;
        }

        const text = await response.text();

        if (!text.trim()) {
          throw new Error("Empty script response");
        }

        if (contentType.includes("text/html")) {
          throw new Error("Received HTML instead of JavaScript");
        }

        return text;
      } finally {
        clearTimeout(timer);
        controllers.delete(controller);
      }
    }

    

async function fetchWithFallback(path, name, options = {}) {
  const responseType = options.responseType || "blob";
  const maxAttempts = 4;
  const url = sources(path)[0];

  let lastError;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      console.log(
        `[ROUNDS] Downloading ${name} (${attempt}/${maxAttempts})`
      );

      // Match the successful Console test.
      // Do not use the old fetchOnce() timeout logic.
      const response = await fetch(url, {
        method: "GET",
        cache: "default"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const expected = Number(
        response.headers.get("content-length")
      );

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();

        if (done) break;

        chunks.push(value);
        received += value.byteLength;
      }

      if (expected && received !== expected) {
        throw new Error(
          `Incomplete download: ${received}/${expected} bytes`
        );
      }

      console.log(
        `[ROUNDS] ${name} downloaded: ${received} bytes`
      );

      const blob = new Blob(chunks);

      if (responseType === "text") {
        return await blob.text();
      }

      if (responseType === "arrayBuffer") {
        return await blob.arrayBuffer();
      }

      return blob;
    } catch (error) {
      lastError = error;

      console.warn(
        `[ROUNDS] ${name} failed on attempt ${attempt}:`,
        error
      );

      if (attempt < maxAttempts) {
        await new Promise(resolve =>
          setTimeout(resolve, attempt * 1500)
        );
      }
    }
  }

  throw new Error(
    `${name}: ${lastError?.message || "Download failed"}`
  );
}


    async function fetchPart(part) {
      if (loadedParts.has(part.name)) {
        return loadedParts.get(part.name);
      }

      const path = BUILD_PATH + part.name;

      const blob = await fetchWithFallback(
        path,
        part.name
      );

      loadedParts.set(part.name, blob);

      const count = loadedParts.size;

      progress(
        (count / parts.length) * 65,
        `Downloading game files (${count}/${parts.length})...`
      );

      return blob;
    }

    async function downloadParts() {
      const queue = parts.filter(
        part => !loadedParts.has(part.name)
      );

      let nextIndex = 0;
      let failure = null;

      async function worker() {
        while (!failure) {
          const index = nextIndex++;

          if (index >= queue.length) {
            return;
          }

          try {
            await fetchPart(queue[index]);
          } catch (error) {
            failure = error;
            return;
          }
        }
      }

      const workerCount = Math.min(
        MAX_CONCURRENT,
        queue.length
      );

      await Promise.all(
        Array.from(
          { length: workerCount },
          () => worker()
        )
      );

      if (failure) throw failure;
    }

    function makeMergedUrl(kind, mime) {
      const blobs = parts
        .filter(part => part.kind === kind)
        .map(part => loadedParts.get(part.name));

      if (blobs.some(blob => !blob || !blob.size)) {
        throw new Error(`Missing ${kind} chunks`);
      }

      const merged = new Blob(blobs, { type: mime });
      const url = URL.createObjectURL(merged);

      blobUrls.push(url);

      console.info(
        `[ROUNDS] Combined ${kind}:`,
        merged.size,
        "bytes"
      );

      return url;
    }

    function cleanupBlobUrls() {
      for (const url of blobUrls.splice(0)) {
        URL.revokeObjectURL(url);
      }
    }

    const config = {
  dataUrl: "",
  frameworkUrl: sources(
    "Build/WebBuild.framework.js"
  )[0],
  codeUrl: "",
  streamingAssetsUrl: sources("StreamingAssets/")[0],
  companyName: "Landfall Games",
  productName: "ROUNDS",
  productVersion: "1.1.2",
  showBanner: warning
};

    async function loadUnityLoader() {
      if (typeof createUnityInstance === "function") {
        return;
      }

      const source = await fetchWithFallback(
        BUILD_PATH + "WebBuild.loader.js",
        "Unity loader",
        { responseType: "text" }
      );

      const tag = document.createElement("script");
      tag.textContent =
        source + "\n//# sourceURL=WebBuild.loader.js";

      document.body.appendChild(tag);

      if (typeof createUnityInstance !== "function") {
        throw new Error(
          "Unity loader did not initialize"
        );
      }
    }

    async function startGame() {
      if (running || completed || unityStarted) return;

      running = true;
      retryButton.style.display = "none";
      warnings.textContent = "";

      loader.style.display = "flex";
      loader.classList.remove("fading");

      progress(
        lastProgress,
        "Connecting to game servers..."
      );

      try {
        // Loader and chunk downloads can proceed together.
        const results = await Promise.allSettled([
          downloadParts(),
          loadUnityLoader()
        ]);

        const failed = results.find(
          result => result.status === "rejected"
        );

        if (failed) {
          throw failed.reason;
        }

        progress(65, "Combining game files...");

        config.dataUrl = makeMergedUrl(
          "data",
          "application/octet-stream"
        );

        config.codeUrl = makeMergedUrl(
          "wasm",
          "application/wasm"
        );

        // Use the same successful source for framework JS.
        config.frameworkUrl = sources(
          BUILD_PATH + "WebBuild.framework.js"
        )[preferredSource];

        config.streamingAssetsUrl = sources(
          "StreamingAssets/"
        )[preferredSource];

        progress(65, "Starting Unity...");

        unityStarted = true;

        await createUnityInstance(
          canvas,
          config,
          p => progress(
            65 + p * 35,
            "Loading ROUNDS..."
          )
        );

        completed = true;
        progress(100, "Ready!");

        loader.classList.add("fading");

        setTimeout(() => {
          loader.style.display = "none";
        }, 750);
      } catch (error) {
        console.error(
          "[ROUNDS] Game loading failed:",
          error
        );

        status.textContent =
          `Loading failed: ${error.message || String(error)}`;

        // A Unity initialization failure may leave a partial
        // runtime behind, so don't blindly create another one.
        if (!unityStarted) {
          retryButton.style.display = "inline-block";

          cleanupBlobUrls();
          config.dataUrl = "";
          config.codeUrl = "";
        } else {
          status.textContent +=
            " — Reload the page to retry.";
        }
      } finally {
        running = false;
      }
    }

    retryButton.addEventListener("click", () => {
      startGame();
    });

    window.addEventListener("pagehide", () => {
      for (const controller of controllers) {
        controller.abort();
      }

      cleanupBlobUrls();
    });

    startGame();
  })();
  </script>
</body>
