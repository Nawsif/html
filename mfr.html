  <meta name="theme-color" content="#000" />

  <style>
    html {
      background: #414141;
      font-family: sans-serif;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #414141;
    }

    #canvas,
    #overlayDiv {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #canvas {
      background: #000;
    }

    .visible {
      visibility: visible;
      opacity: 1;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

    #statusDiv,
    #inputDiv {
      background: rgba(0, 0, 0, 0.75);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 10px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      border-radius: 0 0 5px 5px;
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }

    #statusProgress {
      display: none;
      width: 100%;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;
    }

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #fff;
    }

    #ContextContainer {
      position: absolute;
      left: 0;
      top: 0;
      color: white;
      z-index: 100;
    }

    #ContextContainer.shown {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0 0 5px 0;
    }

    #ContextButton {
      text-decoration: none;
      color: lightgrey;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px;
      opacity: .75;
    }

    #ContextButton:focus {
      outline: none;
      color: #fff;
      opacity: 1;
    }

    #ContextMenu a {
      text-decoration: none;
      color: lightgrey;
      background: #444;
      height: 48px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid lightgrey;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 5px;
      opacity: 1;
    }

    #ContextMenu a:hover {
      background: #666;
      color: #fff;
    }

    /* ==========================
       TINKLE LOADER
       ========================== */

    #tinkle-loader {
      position: fixed;
      inset: 0;

      background: #414141;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      z-index: 9000;

      opacity: 1;
      visibility: visible;

      transition:
        opacity .6s ease,
        visibility .6s ease;
    }

    #tinkle-loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #tinkle-loader-title {
      color: white;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: .3px;
    }

    #tinkle-loader-bar {
      width: min(320px, 70vw);
      height: 5px;

      overflow: hidden;

      border-radius: 10px;

      background: rgba(255, 255, 255, .14);
    }

    #tinkle-loader-progress {
      width: 0%;
      height: 100%;

      background: white;

      border-radius: inherit;

      transition: width .25s ease;
    }

    #tinkle-loader-text {
      color: rgba(255, 255, 255, .65);

      margin-top: 12px;

      font-size: 13px;
    }
  </style>

<body>

  <canvas
    id="canvas"
    oncontextmenu="event.preventDefault()"
    tabindex="-1">
  </canvas>

  <div id="overlayDiv"></div>


  <!-- Tinkle loader -->

  <div id="tinkle-loader">
    <div id="tinkle-loader-title">
      Loading
    </div>

    <div id="tinkle-loader-bar">
      <div id="tinkle-loader-progress"></div>
    </div>

    <div id="tinkle-loader-text">
      Starting game...
    </div>
  </div>


  <div id="ContextContainer">

    <a id="ContextButton">&#8801;</a>

    <br>

    <div id="ContextMenu" style="display:none">

      <input
        id="ID_SavegamesImport"
        type="file"
        onchange="onSavegamesImport(this)"
        accept="application/zip"
        style="display:none">

      <a href="javascript:document.getElementById('ID_SavegamesImport').click();">
        Import Saves
      </a>

      <a href="javascript:onSavegamesExport();">
        Export Saves
      </a>

      <a href="javascript:FSDownload('/log.txt', 'text/plain');">
        Download Log
      </a>

      <a href="https://www.renpy.org/" target="_blank">
        Powered by Ren'Py
      </a>

    </div>

  </div>


  <div id="statusDiv" class="hidden">
    <div id="statusTextDiv"></div>

    <progress
      id="statusProgress"
      value="0"
      max="100">
    </progress>
  </div>


  <div id="inputDiv" class="hidden">

    <form id="inputForm">

      <div id="inputPrompt"></div>

      <input
        id="inputText"
        type="text">

    </form>

  </div>


  <script>
    /*
     * Service worker
     *
     * Don't attempt registration when the worker
     * resolves to the external CDN.
     */

    if (
      navigator.serviceWorker &&
      window.self === window.top
    ) {

      const serviceWorkerUrl =
        new URL(
          "./service-worker.js",
          document.baseURI
        );

      if (
        serviceWorkerUrl.origin ===
        window.location.origin &&
        !navigator.serviceWorker.controller
      ) {

        navigator.serviceWorker
          .register(
            serviceWorkerUrl,
            {
              updateViaCache: "all"
            }
          )
          .catch(error => {
            console.warn(
              "Service worker registration failed:",
              error
            );
          });

      }
    }
  </script>


  <script>
    /*
     * Tinkle loader integration
     */

    const tinkleLoader =
      document.getElementById(
        "tinkle-loader"
      );

    const tinkleProgress =
      document.getElementById(
        "tinkle-loader-progress"
      );

    const tinkleText =
      document.getElementById(
        "tinkle-loader-text"
      );


    let fakeProgress = 5;


    function setTinkleProgress(
      percent,
      text
    ) {

      percent = Math.max(
        0,
        Math.min(
          100,
          percent
        )
      );

      tinkleProgress.style.width =
        percent + "%";

      if (text) {
        tinkleText.textContent = text;
      }

    }


    /*
     * Slowly move the bar while
     * Ren'Py downloads.
     */

    const loaderTimer =
      setInterval(() => {

        if (
          fakeProgress < 88
        ) {

          fakeProgress +=
            Math.random() * 3;

          setTinkleProgress(
            fakeProgress,
            "Loading game..."
          );

        }

      }, 500);


    /*
     * Watch Ren'Py's normal
     * loading status.
     */

    const statusText =
      document.getElementById(
        "statusTextDiv"
      );


    if (statusText) {

      const observer =
        new MutationObserver(() => {

          const text =
            statusText
              .textContent
              .trim();

          if (text) {

            tinkleText.textContent =
              text;

          }

        });


      observer.observe(
        statusText,
        {
          childList: true,
          subtree: true,
          characterData: true
        }
      );

    }


    /*
     * When canvas starts drawing,
     * finish the loader.
     */

    function finishTinkleLoader() {

      clearInterval(
        loaderTimer
      );

      setTinkleProgress(
        100,
        "Ready"
      );


      setTimeout(() => {

        tinkleLoader.classList.add(
          "hide"
        );

      }, 250);


      setTimeout(() => {

        tinkleLoader.remove();

      }, 1000);

    }


    /*
     * Give Ren'Py a moment to start,
     * then detect canvas rendering.
     */

    window.addEventListener(
      "load",
      () => {

        setTinkleProgress(
          15,
          "Loading engine..."
        );


        const canvas =
          document.getElementById(
            "canvas"
          );


        let attempts = 0;


        const readyCheck =
          setInterval(() => {

            attempts++;


            if (
              canvas.width > 0 &&
              canvas.height > 0 &&
              attempts > 2
            ) {

              clearInterval(
                readyCheck
              );

              finishTinkleLoader();

            }


            /*
             * fallback
             */

            if (
              attempts > 120
            ) {

              clearInterval(
                readyCheck
              );

              finishTinkleLoader();

            }

          }, 250);

      }
    );
  </script>


  <script src="renpy-pre.js"></script>

  <script
    async
    type="text/javascript"
    src="renpy.js">
  </script>

</body>
