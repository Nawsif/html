<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/whatareyoutryingtodo/disable-devtool.min.js" disable-devtool-auto></script>
    <script src="https://tinklehost.github.io/intro.js"></script>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Dumb Ways to Die</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="game"></div>

    <script src="https://cdn.jsdelivr.net/gh/u-cvlassrom-y/google@main/ruffle.js"></script>

    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            document.getElementById("game").appendChild(player);

            player.load({
                url: "https://cdn.jsdelivr.net/gh/web-ports/dumb-ways-to-die@main/data/main.swf"
            });
        });
    </script>
</body>
</html>
