<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#231321">
  <title>Page not found</title>
  <style>
    :root {
      color-scheme: dark;
      --cream: #fff2dd;
      --gold: #ffad65;
      --mouse-x: 50%;
      --mouse-y: 45%;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      isolation: isolate;
      padding: 24px;
      background: #231321;
      color: var(--cream);
      font: 1rem/1.55 system-ui, sans-serif;
    }

    .scene, .light, .leaves, canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .scene {
      z-index: -3;
      overflow: hidden;
      background: linear-gradient(#231321, #642f2c 54%, #c2673b);
    }

    .scene svg {
      display: block;
      width: 100%;
      height: 100%;
      animation: reveal 1.8s cubic-bezier(.2, .75, .25, 1) both;
    }

    .light {
      z-index: -2;
      background: radial-gradient(
        circle at var(--mouse-x) var(--mouse-y), #ffd09638, transparent 30%
      );
      mix-blend-mode: screen;
    }

    .leaves { z-index: -1; overflow: hidden; }

    .leaves i {
      position: absolute;
      top: -40px;
      left: var(--x);
      width: var(--size);
      aspect-ratio: 1;
      border-radius: 75% 5% 75% 10%;
      background: linear-gradient(135deg, #ffc170, #a33a24);
      animation: fall var(--speed) var(--delay) linear infinite;
    }

    main {
      width: min(100%, 34rem);
      padding: clamp(28px, 7vw, 58px);
      border: 1px solid #ffbf7c66;
      border-radius: 28px;
      background: linear-gradient(145deg, #45251fe6, #23141bea);
      box-shadow: 0 28px 95px #140910aa, inset 0 1px #ffe2b428;
      backdrop-filter: blur(12px);
      text-align: center;
      animation: rise .95s .16s both;
    }

    .brand {
      margin: 0;
      color: #ffd19e;
      font: italic clamp(1.45rem, 5vw, 2rem)/1.2 Georgia, serif;
      animation: rise .65s .42s both;
    }

    .number {
      display: flex;
      justify-content: center;
      margin: .14em 0 0;
      color: var(--gold);
      font-size: clamp(4.5rem, 21vw, 9rem);
      font-weight: 900;
      letter-spacing: -.065em;
      line-height: 1;
      text-shadow: 0 0 44px #ff8a5566;
    }

    .number span {
      animation: digit .75s cubic-bezier(.15, .8, .25, 1) both;
    }

    .number span:nth-child(1) { animation-delay: .45s; }
    .number span:nth-child(2) { animation-delay: .56s; }
    .number span:nth-child(3) { animation-delay: .67s; }

    h1 {
      margin: .45rem 0 .25rem;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      animation: rise .65s .8s both;
    }

    .message {
      margin: 0;
      color: #e9c5a6;
      animation: rise .65s .94s both;
    }

    canvas { z-index: 1; width: 100%; height: 100%; }

    .cursor {
      display: none;
      position: fixed;
      z-index: 2;
      top: 0;
      left: 0;
      width: 29px;
      height: 29px;
      margin: -5px;
      pointer-events: none;
      filter: drop-shadow(0 0 7px #ff8d42);
    }

    html.mouse-active, html.mouse-active body { cursor: none; }
    html.mouse-active .cursor { display: block; }
    .cursor svg { width: 100%; height: 100%; }

    @keyframes reveal {
      from { opacity: .2; transform: scale(1.12); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes digit {
      from { opacity: 0; transform: translateY(25px) rotate(8deg) scale(.8); filter: blur(7px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    @keyframes fall {
      0% { opacity: 0; transform: translate(0, -5vh) rotate(0); }
      15%, 75% { opacity: .7; }
      100% { opacity: 0; transform: translate(130px, 115vh) rotate(380deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .leaves, .light, canvas { display: none; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="halo">
          <stop stop-color="#ffc178" stop-opacity=".7"/>
          <stop offset="1" stop-color="#ffc178" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sun" x2="0" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#ffe6a1"/>
          <stop offset="1" stop-color="#ff9a63"/>
        </linearGradient>
        <path id="tree" d="M-20 175-5 119-12 93-37 72-39 60-12 77-24 39-15 42 1 77 14 48 26 42 14 67 36 56 37 65 10 86 9 116 25 175Z"/>
      </defs>
      <circle cx="1045" cy="285" r="265" fill="url(#halo)"/>
      <circle cx="1045" cy="285" r="102" fill="url(#sun)"/>
      <path fill="#794438" d="M0 560Q220 325 495 547T925 519Q1170 388 1440 491V900H0Z"/>
      <path fill="#4e2b31" d="M0 620Q200 488 480 629T1000 572Q1220 482 1440 585V900H0Z"/>
      <path fill="#2e1b25" d="M0 704Q236 566 510 715T1100 670Q1320 568 1440 655V900H0Z"/>
      <path fill="#1b131d" d="M0 764Q265 666 480 788T1040 778Q1260 645 1440 714V900H0Z"/>
      <g fill="#241721">
        <use href="#tree" transform="translate(115 494) scale(1.4)"/>
        <use href="#tree" transform="translate(1345 444) scale(1.65)"/>
        <use href="#tree" transform="translate(1250 560) scale(.85)"/>
      </g>
    </svg>
  </div>
  <div class="light" aria-hidden="true"></div>
  <div class="leaves" aria-hidden="true"></div>
  <canvas aria-hidden="true"></canvas>
  <div class="cursor" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <path d="M5 5c12 0 22 5 20 15-2 8-14 8-17 0C6 15 8 11 5 5Z"
            fill="#ffba70" stroke="#fff2d2" stroke-width="1.2"/>
      <path d="M8 8l16 20" stroke="#79391e" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </div>
  <main>
    <p class="number" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>
    <h1>Page not found</h1>
    <p class="message">Somewhere along the trail, this page went missing.</p>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const leaves = document.querySelector('.leaves');
      for (let i = 0; i < 20; i++) {
        const leaf = document.createElement('i');
        leaf.style.setProperty('--x', `${i * 37 % 103}%`);
        leaf.style.setProperty('--size', `${9 + i * 7 % 19}px`);
        leaf.style.setProperty('--speed', `${9 + i * 3 % 11}s`);
        leaf.style.setProperty('--delay', `-${i * 7 % 19}s`);
        leaves.append(leaf);
      }

      const cursor = document.querySelector('.cursor');
      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const motion = matchMedia('(prefers-reduced-motion: no-preference)');
      const trail = [];
      const bursts = [];
      let frame = 0;

      function reset() {
        root.classList.remove('mouse-active');
        cancelAnimationFrame(frame);
        frame = 0;
        trail.length = 0;
        bursts.length = 0;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
      }

      function resize() {
        const scale = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.ceil(innerWidth * scale);
        canvas.height = Math.ceil(innerHeight * scale);
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        reset();
      }

      function draw(now) {
        frame = 0;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        while (trail.length && now - trail[0].time >= 320) trail.shift();
        while (bursts.length && now - bursts[0].time >= 540) bursts.shift();

        if (trail.length > 1) {
          const tip = trail[trail.length - 1];
          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);
          for (let i = 1; i < trail.length; i++) {
            const a = trail[i - 1];
            const b = trail[i];
            ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
          }
          ctx.lineTo(tip.x, tip.y);
          ctx.globalAlpha = .42 * (1 - Math.max(0, now - tip.time) / 320);
          ctx.strokeStyle = '#ffae68';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        ctx.fillStyle = '#ffc882';
        for (const burst of bursts) {
          const age = Math.max(0, now - burst.time) / 540;
          const radius = 7 + 51 * (1 - (1 - age) ** 2);
          ctx.globalAlpha = (1 - age) ** 2;
          for (let i = 0; i < 12; i++) {
            const angle = i * Math.PI / 6;
            ctx.beginPath();
            ctx.arc(
              burst.x + Math.cos(angle) * radius,
              burst.y + Math.sin(angle) * radius,
              1.8 - age,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
        }

        if (trail.length || bursts.length) queue();
      }

      function queue() {
        if (!frame) frame = requestAnimationFrame(draw);
      }

      addEventListener('pointermove', (event) => {
        if (!motion.matches || event.pointerType !== 'mouse') return;
        const { clientX: x, clientY: y } = event;
        const time = performance.now();
        const last = trail[trail.length - 1];
        if (last && time - last.time > 90) trail.length = 0;
        trail.push({ x, y, time });
        if (trail.length > 80) trail.shift();
        root.style.setProperty('--mouse-x', `${x}px`);
        root.style.setProperty('--mouse-y', `${y}px`);
        cursor.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        root.classList.add('mouse-active');
        queue();
      }, { passive: true });

      addEventListener('pointerdown', (event) => {
        if (!motion.matches || event.pointerType !== 'mouse' || event.button !== 0) return;
        bursts.push({ x: event.clientX, y: event.clientY, time: performance.now() });
        if (bursts.length > 12) bursts.shift();
        queue();
      });

      root.addEventListener('pointerleave', reset);
      addEventListener('blur', reset);
      addEventListener('resize', resize);
      motion.addEventListener('change', reset);
      resize();
    })();
  </script>
</body>
</html>
