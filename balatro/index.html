<!doctype html>
<html lang="en-us">

<head>
    <!-- Needed for SharedArrayBuffer on GitHub Pages -->
    <script src="./coi-serviceworker.js"></script>

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1"
    >

    <title>Balatro</title>

    <link rel="stylesheet" type="text/css" href="./theme/love.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #loadingCanvas,
        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #canvas {
            visibility: hidden;
        }
    </style>
</head>

<body>

<div id="game-container">

    <canvas
        id="loadingCanvas"
        width="800"
        height="600"
        oncontextmenu="event.preventDefault()">
    </canvas>

    <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()">
    </canvas>

</div>

<script type="text/javascript">

    /*
     * Resize the actual LÖVE canvas to match the browser window.
     */
    function resizeGame() {
        var canvas = document.getElementById("canvas");

        canvas.width =
            window.innerWidth ||
            document.documentElement.clientWidth ||
            document.body.clientWidth;

        canvas.height =
            window.innerHeight ||
            document.documentElement.clientHeight ||
            document.body.clientHeight;
    }

    resizeGame();

    window.addEventListener("resize", resizeGame);


    /*
     * Fullscreen.
     * Browsers require this to be triggered by a user interaction.
     */
    function goFullScreen() {
        var canvas = document.getElementById("canvas");

        if (canvas.requestFullscreen) {
            canvas.requestFullscreen();
        } else if (canvas.webkitRequestFullscreen) {
            canvas.webkitRequestFullscreen();
        } else if (canvas.mozRequestFullScreen) {
            canvas.mozRequestFullScreen();
        }
    }


    /*
     * Loading screen.
     */
    var loadingCanvas =
        document.getElementById("loadingCanvas");

    var loadingContext =
        loadingCanvas.getContext("2d");


    function drawLoadingText(text) {

        var canvas = loadingContext.canvas;

        loadingContext.fillStyle =
            "rgb(142, 195, 227)";

        loadingContext.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        loadingContext.font = "2em Arial";
        loadingContext.textAlign = "center";

        loadingContext.fillStyle =
            "rgb(11, 86, 117)";

        loadingContext.fillText(
            text,
            canvas.width / 2,
            canvas.height / 2
        );

        loadingContext.font = "1.2em Arial";

        loadingContext.fillText(
            "Powered by Emscripten",
            canvas.width / 2,
            canvas.height / 4
        );

        loadingContext.fillText(
            "Powered by LÖVE",
            canvas.width / 2,
            canvas.height / 4 * 3
        );
    }


    /*
     * Keep keyboard input focused on the game.
     */
    window.addEventListener("load", function () {
        window.focus();
    });

    window.addEventListener("click", function () {
        window.focus();
    });

    window.addEventListener(
        "keydown",
        function (e) {

            if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }

        },
        false
    );


    /*
     * love.js / Emscripten configuration.
     */
    var Module = {

        arguments: [
            "./game.love"
        ],

        INITIAL_MEMORY: 1073741824,

        printErr: console.error.bind(console),

        canvas: (function () {

            var canvas =
                document.getElementById("canvas");

            canvas.addEventListener(
                "webglcontextlost",
                function (e) {

                    console.error(
                        "WebGL context lost."
                    );

                    alert(
                        "WebGL context lost. Reload the page to restart the game."
                    );

                    e.preventDefault();
                },
                false
            );

            return canvas;

        })(),

        setStatus: function (text) {

            if (text) {

                drawLoadingText(text);

            } else if (
                Module.remainingDependencies === 0
            ) {

                document.getElementById(
                    "loadingCanvas"
                ).style.display = "none";

                document.getElementById(
                    "canvas"
                ).style.visibility = "visible";
            }
        },

        totalDependencies: 0,

        remainingDependencies: 0,

        monitorRunDependencies: function (left) {

            this.remainingDependencies = left;

            this.totalDependencies =
                Math.max(
                    this.totalDependencies,
                    left
                );

            Module.setStatus(
                left
                    ? "Preparing... (" +
                      (this.totalDependencies - left) +
                      "/" +
                      this.totalDependencies +
                      ")"
                    : "All downloads complete."
            );
        }
    };


    Module.setStatus("Downloading...");


    window.onerror = function (
        message,
        source,
        lineno,
        colno,
        error
    ) {

        console.error(
            "GAME ERROR:",
            message,
            source,
            lineno,
            colno,
            error
        );

        Module.setStatus(
            "Exception thrown - check console"
        );
    };


    var applicationLoad = function () {

        console.log("=== BALATRO WEB START ===");

        console.log(
            "Cross-origin isolated:",
            window.crossOriginIsolated
        );

        console.log(
            "SharedArrayBuffer:",
            typeof SharedArrayBuffer
        );

        Love(Module);
    };

</script>


<script
    type="text/javascript"
    src="./game.js">
</script>

<script
    async
    type="text/javascript"
    src="./love.js"
    onload="applicationLoad()">
</script>

</body>
</html>
