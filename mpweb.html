<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">

	<base href="https://cdn.jsdelivr.net/gh/tinklegames/mp-web@main/docs/">

	<meta
		name="viewport"
		content="width=device-width, user-scalable=no, initial-scale=1.0"
	>

	<title>Machine Party</title>

	<style>
		html,
		body,
		#canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			color: white;
			background: black;
			overflow: hidden;
			touch-action: none;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

		#canvas:focus {
			outline: none;
		}

		#status {
			position: fixed;
			inset: 0;

			background: black;

			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;

			z-index: 9999;
		}

		#loading-text {
			font-family: Arial, sans-serif;
			font-size: 24px;

			text-align: center;

			margin-bottom: 20px;
		}

		#status-progress {
			width: min(600px, 70vw);
			height: 20px;
		}

		#status-notice {
			display: none;

			max-width: 700px;

			margin: 20px;
			padding: 15px;

			background: #5b3943;

			border: 1px solid #9b3943;
			border-radius: 8px;

			font-family: Arial, sans-serif;

			white-space: pre-wrap;
		}
	</style>

	<link
		rel="icon"
		type="image/png"
		href="index.icon.png"
	>

	<link
		rel="apple-touch-icon"
		href="index.apple-touch-icon.png"
	>
</head>


<body>

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>


	<div id="status">

		<div id="loading-text">
			Loading Machine Party...
		</div>

		<progress
			id="status-progress"
			value="0"
			max="1"
		></progress>

		<div id="status-notice"></div>

	</div>


	<!--
	Loaded from:

	https://cdn.jsdelivr.net/gh/tinklegames/mp-web@main/docs/index.js
	-->
	<script src="index.js"></script>


	<script>
		const GODOT_CONFIG = {
			args: [],

			canvasResizePolicy: 2,

			emscriptenPoolSize: 8,

			ensureCrossOriginIsolationHeaders: false,

			executable: "index",

			experimentalVK: false,

			fileSizes: {
				"index.pck": 635943632,
				"index.wasm": 36157734
			},

			focusCanvas: true,

			gdextensionLibs: [],

			godotPoolSize: 4
		};


		const GODOT_THREADS_ENABLED = false;


		/*
			You created the parts with:

			split -b 15m -d -a 3 index.wasm index.wasm.part-

			split -b 15m -d -a 3 index.pck index.pck.part-
		*/

		const CHUNK_SIZE =
			15 * 1024 * 1024;


		const WASM_SIZE =
			GODOT_CONFIG.fileSizes["index.wasm"];


		const PCK_SIZE =
			GODOT_CONFIG.fileSizes["index.pck"];


		const WASM_PART_COUNT =
			Math.ceil(
				WASM_SIZE / CHUNK_SIZE
			);


		const PCK_PART_COUNT =
			Math.ceil(
				PCK_SIZE / CHUNK_SIZE
			);


		const statusOverlay =
			document.getElementById(
				"status"
			);


		const loadingText =
			document.getElementById(
				"loading-text"
			);


		const progress =
			document.getElementById(
				"status-progress"
			);


		const notice =
			document.getElementById(
				"status-notice"
			);


		function makePartList(
			prefix,
			count
		) {

			const result = [];

			for (
				let i = 0;
				i < count;
				i++
			) {

				result.push(
					prefix +
					String(i).padStart(
						3,
						"0"
					)
				);

			}

			return result;
		}


		const WASM_PARTS =
			makePartList(
				"index.wasm.part-",
				WASM_PART_COUNT
			);


		const PCK_PARTS =
			makePartList(
				"index.pck.part-",
				PCK_PART_COUNT
			);


		console.log(
			"WASM parts:",
			WASM_PARTS
		);


		console.log(
			"PCK parts:",
			PCK_PARTS
		);


		function updateText(text) {

			loadingText.textContent =
				text;

		}


		function updateProgress(
			current,
			total
		) {

			progress.max = total;
			progress.value = current;

		}


		function showError(error) {

			console.error(
				"Machine Party loader error:",
				error
			);


			progress.style.display =
				"none";


			loadingText.style.display =
				"none";


			notice.style.display =
				"block";


			if (
				error instanceof Error
			) {

				notice.textContent =
					error.stack ||
					error.message;

			} else {

				notice.textContent =
					String(error);

			}
		}


		/*
			Download and reconstruct one split file.
		*/
		async function rebuildFile(
			parts,
			expectedSize,
			description,
			progressOffset,
			progressTotal
		) {

			const output =
				new Uint8Array(
					expectedSize
				);


			let offset = 0;


			for (
				let i = 0;
				i < parts.length;
				i++
			) {

				const part =
					parts[i];


				const partURL =
					new URL(
						part,
						document.baseURI
					).href;


				updateText(
					`${description} ${i + 1}/${parts.length}`
				);


				console.log(
					"Downloading:",
					partURL
				);


				const response =
					await fetch(
						partURL,
						{
							cache: "default"
						}
					);


				if (
					!response.ok
				) {

					throw new Error(
						`Failed to load ${part}\n` +
						`${response.status} ${response.statusText}`
					);

				}


				const buffer =
					await response.arrayBuffer();


				const bytes =
					new Uint8Array(
						buffer
					);


				if (
					offset +
					bytes.byteLength >
					output.byteLength
				) {

					throw new Error(
						`${part} is larger than expected.`
					);

				}


				output.set(
					bytes,
					offset
				);


				offset +=
					bytes.byteLength;


				updateProgress(
					progressOffset +
					i +
					1,

					progressTotal
				);
			}


			if (
				offset !==
				expectedSize
			) {

				throw new Error(
					`${description} size mismatch.\n\n` +
					`Expected: ${expectedSize} bytes\n` +
					`Received: ${offset} bytes`
				);

			}


			console.log(
				`${description} reconstructed:`,
				offset,
				"bytes"
			);


			return output.buffer;
		}


		/*
			This variable will contain the complete
			reconstructed WebAssembly file.
		*/
		let reconstructedWasm = null;


		/*
			Save the browser's real fetch function before
			we replace it.
		*/
		const realFetch =
			window.fetch.bind(
				window
			);


		/*
			Intercept Godot's request for index.wasm.

			Godot will think it is downloading:

				index.wasm

			but we return the WASM we reconstructed from
			the split files.
		*/
		window.fetch =
			async function(
				input,
				init
			) {

				let url;


				if (
					typeof input === "string"
				) {

					url = input;

				} else if (
					input instanceof URL
				) {

					url = input.href;

				} else {

					url = input.url;

				}


				const resolvedURL =
					new URL(
						url,
						document.baseURI
					);


				/*
					Catch index.wasm only.
				*/
				if (
					reconstructedWasm !== null &&
					resolvedURL.pathname.endsWith(
						"/index.wasm"
					)
				) {

					console.log(
						"Serving reconstructed index.wasm"
					);


					/*
						Return a fresh copy because some
						loaders consume the response body.
					*/
					return new Response(
						reconstructedWasm.slice(0),

						{
							status: 200,

							headers: {
								"Content-Type":
									"application/wasm",

								"Content-Length":
									String(
										reconstructedWasm.byteLength
									)
							}
						}
					);
				}


				return realFetch(
					input,
					init
				);
			};


		async function startGame() {

			try {

				/*
					Make sure the browser supports the
					features required by this Godot export.
				*/
				const missing =
					Engine.getMissingFeatures({
						threads:
							GODOT_THREADS_ENABLED
					});


				if (
					missing.length > 0
				) {

					throw new Error(
						"Missing browser features:\n" +
						missing.join("\n")
					);

				}


				const totalParts =
					WASM_PARTS.length +
					PCK_PARTS.length;


				updateProgress(
					0,
					totalParts
				);


				/*
					===================================
					1. REBUILD THE WASM
					===================================
				*/

				reconstructedWasm =
					await rebuildFile(
						WASM_PARTS,

						WASM_SIZE,

						"Downloading engine",

						0,

						totalParts
					);


				console.log(
					"Complete WASM ready:",
					reconstructedWasm.byteLength,
					"bytes"
				);


				/*
					===================================
					2. INITIALIZE GODOT
					===================================
				*/

				updateText(
					"Initializing Godot..."
				);


				const engine =
					new Engine(
						GODOT_CONFIG
					);


				/*
					IMPORTANT:

					"index" is the BASE PATH.

					Godot will request:

						index.wasm

					Our fetch interceptor catches it.
				*/
				await engine.init(
					"index"
				);


				console.log(
					"Godot engine initialized."
				);


				/*
					===================================
					3. REBUILD THE PCK
					===================================
				*/

				const pckBuffer =
					await rebuildFile(
						PCK_PARTS,

						PCK_SIZE,

						"Downloading game",

						WASM_PARTS.length,

						totalParts
					);


				console.log(
					"Complete PCK ready:",
					pckBuffer.byteLength,
					"bytes"
				);


				/*
					===================================
					4. PRELOAD PCK INTO GODOT
					===================================
				*/

				updateText(
					"Loading game data..."
				);


				await engine.preloadFile(
					pckBuffer,
					"index.pck"
				);


				console.log(
					"PCK preloaded."
				);


				/*
					We don't need our JS-side reference to
					the PCK anymore after preloadFile.
				*/


				/*
					===================================
					5. START MACHINE PARTY
					===================================
				*/

				updateText(
					"Starting Machine Party..."
				);


				await engine.start({

					args: [
						"--main-pack",
						"index.pck"
					]

				});


				console.log(
					"Machine Party started."
				);


				/*
					Engine is initialized, so release our
					extra JavaScript reference to the WASM.
				*/

				reconstructedWasm =
					null;


				statusOverlay.remove();


			} catch (error) {

				showError(
					error
				);

			}
		}


		startGame();

	</script>

</body>

</html>
