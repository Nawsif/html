<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Swingo</title>

	<base href="https://cdn.jsdelivr.net/gh/tinklehost/hosting@main/swingo/">

	<!-- Redirect incorrect Construct runtime URL -->
	<script>
	(function () {
		const OLD_BASE = "https://tinklehost.github.io/html/";
		const NEW_BASE = "https://cdn.jsdelivr.net/gh/tinklehost/hosting@main/swingo/";

		function fixURL(url) {
			if (typeof url !== "string")
				return url;

			if (url.startsWith(OLD_BASE)) {
				const fixed = NEW_BASE + url.substring(OLD_BASE.length);

				console.log(
					"[Swingo URL Fix]",
					url,
					"->",
					fixed
				);

				return fixed;
			}

			return url;
		}

		// Intercept Web Workers
		const OriginalWorker = window.Worker;

		if (OriginalWorker) {
			window.Worker = function (url, options) {
				return new OriginalWorker(fixURL(String(url)), options);
			};

			window.Worker.prototype = OriginalWorker.prototype;
		}

		// Intercept Shared Workers
		const OriginalSharedWorker = window.SharedWorker;

		if (OriginalSharedWorker) {
			window.SharedWorker = function (url, options) {
				return new OriginalSharedWorker(fixURL(String(url)), options);
			};

			window.SharedWorker.prototype = OriginalSharedWorker.prototype;
		}

		// Intercept fetch()
		const originalFetch = window.fetch;

		window.fetch = function (resource, options) {
			if (typeof resource === "string") {
				resource = fixURL(resource);
			}
			else if (resource instanceof Request) {
				const fixed = fixURL(resource.url);

				if (fixed !== resource.url) {
					resource = new Request(fixed, resource);
				}
			}

			return originalFetch.call(this, resource, options);
		};
	})();
	</script>

	<script src="https://tinklehost.github.io/intro.js"></script>
