*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}body:before{content:"";position:fixed;inset:-30%;z-index:-1;background:radial-gradient(ellipse at 20% 25%,#50337a24,transparent 40%),radial-gradient(ellipse at 80% 70%,#273c7625,transparent 40%);animation:ambient 20s ease-in-out infinite alternate}@keyframes ambient{to{transform:translate(5%,-4%)}}header{text-align:center;padding:78px 20px 45px;animation:down .8s both}header .eyebrow{color:var(--accent);letter-spacing:5px;font-size:10px;font-weight:700;text-transform:uppercase}h1{font-family:Outfit,sans-serif;font-size:clamp(38px,6vw,64px);letter-spacing:-2px;margin:13px 0 12px}h1 span{color:var(--accent)}header p{color:var(--muted);font-size:13px}.header-line{width:55px;height:3px;border-radius:10px;background:var(--accent);margin:27px auto 0;box-shadow:0 0 20px #b5a0ff66}.container{width:min(1350px,92%);margin:0 auto 100px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px 22px}.game{min-width:0;animation:enter .65s both;animation-delay:var(--delay)}.cover{position:relative;aspect-ratio:16/9;border-radius:15px;overflow:hidden;background:#1b1d2b;border:1px solid var(--border);cursor:pointer;transition:transform .35s,border-color .3s,box-shadow .35s}.cover:hover{transform:translateY(-7px) scale(1.025);border-color:#a996ff88;box-shadow:0 20px 45px #0008}.cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s,filter .4s}.cover:hover img{transform:scale(1.09);filter:brightness(.7)}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-40%) scale(.85);opacity:0;background:var(--accent);color:#15101f;border:0;border-radius:50px;padding:13px 23px;font-family:Outfit,sans-serif;font-weight:800;pointer-events:none;transition:.3s}.cover:hover .play,.cover:focus-visible .play{opacity:1;transform:translate(-50%,-50%) scale(1)}.cover:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.game-name{font-family:Outfit,sans-serif;font-size:14px;font-weight:600;text-align:center;margin-top:13px;overflow-wrap:anywhere}.game:hover .game-name{color:var(--accent)}.transition{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;justify-content:center;align-items:center;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}.transition.active{opacity:1;visibility:visible}.loader{width:40px;height:40px;border:3px solid #333046;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}.transition-text{margin-top:22px;color:var(--muted);font-size:13px;letter-spacing:2px}.error{color:#ffb6b6;text-align:center;max-width:520px;margin:20px;padding:12px;white-space:pre-wrap}.transition button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}@keyframes down{from{opacity:0;transform:translateY(-18px)}}@keyframes enter{from{opacity:0;transform:translateY(25px)}}@media(max-width:650px){header{padding:50px 15px 35px}.container{width:94%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 13px}.game-name{font-size:12px}.play{opacity:1;top:auto;bottom:10px;transform:translateX(-50%);padding:9px 15px}.cover:hover .play{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

 const lfsRoot=LFS_ROOT+encodeURIComponent(folder)+'/game/';
