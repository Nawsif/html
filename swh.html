<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000">

  <title>Unity WebGL Player</title>

  <script src="https://tinklehost.github.io/intro.js"></script>

  <style>
    html {
      background: #444;
      font-family: sans-serif;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #canvas,
    #overlayDiv {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #canvas {
      display: none;
      background: #000;
    }

    #overlayDiv {
      z-index: 1;
    }

    #presplash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
    }

    #statusDiv {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      width: 50%;
      min-width: 340px;

      margin: auto;
      padding: 10px;

      background: rgba(0, 0, 0, 0.75);
      border-radius: 0 0 5px 5px;

      z-index: 3;
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }

    .file-row {
      display: flex;
      gap: 8px;
      margin: 4px 0;
    }

    .file-name {
      color: #F5A9B8;
    }

    .file-status {
      color: #5BCEFA;
    }

    .file-status.pending {
      color: #888;
    }

    #statusProgress {
      display: none;
      width: 100%;
    }

    #inputDiv {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      width: 65%;

      margin: auto;
      padding: 10px 20px 10px 10px;

      background: rgba(0, 0, 0, 0.75);
      border-radius: 0 0 5px 5px;

      z-index: 4;
    }

    #inputPrompt {
      margin-top: 1em;
      margin-bottom: 1em;
      color: #eee;
      font-size: 150%;
    }

    #inputText {
      width: 100%;
      padding: 5px;

      background: inherit;
      color: #eee;

      font-size: 175%;
    }

    .visible {
      visibility: visible;
      opacity: 1;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;

      transition:
        visibility 0s .25s,
        opacity .25s linear;
    }

    #file-merger-loading {
      display: none !important;
    }
  </style>
</head>

<body>

  <canvas
    id="canvas"
    tabindex="-1"
    oncontextmenu="event.preventDefault()"
  ></canvas>

  <div id="overlayDiv"></div>

  <img
    id="presplash"
    src="splash.png"
    alt=""
  >

  <div id="statusDiv" class="visible">

    <div id="statusTextDiv">

      <div class="file-row">
        <span class="file-name">build8.data:</span>

        <span
          id="status-build8-data"
          class="file-status pending"
        >
          waiting...
        </span>
      </div>

      <div class="file-row">
        <span class="file-name">build8.wasm:</span>

        <span
          id="status-build8-wasm"
          class="file-status pending"
        >
          waiting...
        </span>
      </div>

      <div class="file-row">
        <span class="file-name">engine:</span>

        <span
          id="status-engine"
          class="file-status pending"
        >
          waiting...
        </span>
      </div>

    </div>

    <progress
      id="statusProgress"
      value="0"
      max="100"
    ></progress>

  </div>


  <div id="inputDiv" class="hidden">

    <form id="inputForm">

      <div id="inputPrompt"></div>

      <input
        id="inputText"
        type="text"
      >

    </form>

  </div>


  <script>
    /*
      PAGE:
      https://nawsif.github.io/html/swh/

      GAME REPO:
      https://github.com/nawsif/host/tree/main/swh
    */

    const RAW_BUILD_ROOT =
      "https://raw.githubusercontent.com/nawsif/host/main/swh/Build/";

    const CDN_BUILD_ROOT =
      "https://cdn.jsdelivr.net/gh/nawsif/host@main/swh/Build/";

    const STREAMING_ASSETS_ROOT =
      "https://cdn.jsdelivr.net/gh/nawsif/host@main/swh/StreamingAssets";


    const DATA_PARTS = 7;
    const WASM_PARTS = 3;


    /*
     * Mobile viewport
     */

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

      const meta =
        document.createElement("meta");

      meta.name = "viewport";

      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document.head.appendChild(meta);
    }


    /*
     * Status helper
     */

    function setStatus(id, text, done = false) {

      const el =
        document.getElementById(id);

      if (!el) {
        return;
      }

      el.textContent = text;

      el.classList.remove("pending");

      if (done) {
        el.style.color = "#00e676";
      } else {
        el.style.color = "#ffeb3b";
      }
    }


    /*
     * Build split file URLs
     */

    function getParts(fileName, totalParts) {

      const parts = [];

      for (let i = 0; i < totalParts; i++) {

        parts.push(
          RAW_BUILD_ROOT +
          fileName +
          ".part" +
          i
        );
      }

      return parts;
    }


    /*
     * Download and merge split files
     */

    async function mergeFiles(fileParts, onProgress) {

      const buffers = [];

      for (
        let index = 0;
        index < fileParts.length;
        index++
      ) {

        const url =
          fileParts[index];

        console.log(
          `[${index + 1}/${fileParts.length}] Fetching`,
          url
        );


        const response =
          await fetch(
            url,
            {
              mode: "cors",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `Failed to fetch ${url} - HTTP ${response.status}`
          );
        }


        const buffer =
          await response.arrayBuffer();

        buffers.push(buffer);


        if (onProgress) {

          onProgress(
            index + 1,
            fileParts.length
          );
        }
      }


      let totalLength = 0;

      for (const buffer of buffers) {

        totalLength +=
          buffer.byteLength;
      }


      const merged =
        new Uint8Array(
          totalLength
        );


      let offset = 0;


      for (const buffer of buffers) {

        merged.set(
          new Uint8Array(buffer),
          offset
        );

        offset +=
          buffer.byteLength;
      }


      return new Blob(
        [merged],
        {
          type:
            "application/octet-stream"
        }
      );
    }


    /*
     * Initial status
     */

    setStatus(
      "status-build8-data",
      "merging... part0/part6"
    );

    setStatus(
      "status-build8-wasm",
      "merging... part0/part2"
    );

    setStatus(
      "status-engine",
      "waiting..."
    );


    /*
     * DATA
     */

    const dataPromise =
      mergeFiles(

        getParts(
          "build8.data",
          DATA_PARTS
        ),

        (done, total) => {

          setStatus(
            "status-build8-data",
            `merging... part${done - 1}/part${total - 1}`
          );
        }
      )

      .then(blob => {

        setStatus(
          "status-build8-data",
          "done ✓",
          true
        );

        return blob;
      });


    /*
     * WASM
     */

    const wasmPromise =
      mergeFiles(

        getParts(
          "build8.wasm",
          WASM_PARTS
        ),

        (done, total) => {

          setStatus(
            "status-build8-wasm",
            `merging... part${done - 1}/part${total - 1}`
          );
        }
      )

      .then(blob => {

        setStatus(
          "status-build8-wasm",
          "done ✓",
          true
        );

        return blob;
      });


    /*
     * Start Unity once both large files are merged
     */

    Promise.all([
      dataPromise,
      wasmPromise
    ])

    .then(
      async ([dataBlob, wasmBlob]) => {

        console.log(
          "Both split files merged"
        );


        const dataBlobUrl =
          URL.createObjectURL(
            dataBlob
          );

        const wasmBlobUrl =
          URL.createObjectURL(
            wasmBlob
          );


        console.log(
          "DATA blob:",
          dataBlobUrl
        );

        console.log(
          "WASM blob:",
          wasmBlobUrl
        );


        /*
         * Intercept fetch requests made by Unity.
         */

        const originalFetch =
          window.fetch.bind(window);


        window.fetch =
          async function(resource, options) {

            let url = "";

            if (
              typeof resource ===
              "string"
            ) {

              url = resource;

            } else if (
              resource &&
              resource.url
            ) {

              url =
                resource.url;
            }


            if (
              url &&
              url.includes(
                "build8.data"
              )
            ) {

              console.log(
                "Unity requested DATA -> using merged blob"
              );

              return originalFetch(
                dataBlobUrl,
                options
              );
            }


            if (
              url &&
              url.includes(
                "build8.wasm"
              )
            ) {

              console.log(
                "Unity requested WASM -> using merged blob"
              );

              return originalFetch(
                wasmBlobUrl,
                options
              );
            }


            return originalFetch(
              resource,
              options
            );
          };


        /*
         * Also intercept XMLHttpRequest,
         * since some Unity loaders use XHR.
         */

        const originalOpen =
          XMLHttpRequest
            .prototype
            .open;


        XMLHttpRequest.prototype.open =
          function(
            method,
            url,
            ...rest
          ) {

            if (
              typeof url ===
              "string"
            ) {

              if (
                url.includes(
                  "build8.data"
                )
              ) {

                console.log(
                  "XHR DATA -> merged blob"
                );

                url =
                  dataBlobUrl;
              }


              if (
                url.includes(
                  "build8.wasm"
                )
              ) {

                console.log(
                  "XHR WASM -> merged blob"
                );

                url =
                  wasmBlobUrl;
              }
            }


            return originalOpen.call(
              this,
              method,
              url,
              ...rest
            );
          };


        /*
         * Load Unity loader from jsDelivr.
         */

        const loaderUrl =
          CDN_BUILD_ROOT +
          "build8.loader.js";


        console.log(
          "Loading Unity loader:",
          loaderUrl
        );


        const loaderScript =
          document.createElement(
            "script"
          );


        loaderScript.src =
          loaderUrl;


        loaderScript.onload =
          function() {

            console.log(
              "Unity loader loaded"
            );


            if (
              typeof createUnityInstance !==
              "function"
            ) {

              throw new Error(
                "build8.loader.js loaded but createUnityInstance was not found."
              );
            }


            setStatus(
              "status-engine",
              "starting..."
            );


            document
              .getElementById(
                "canvas"
              )
              .style
              .display =
                "block";


            createUnityInstance(

              document.querySelector(
                "#canvas"
              ),

              {
                /*
                 * These get intercepted above
                 * and replaced with our merged blobs.
                 */

                dataUrl:
                  "Build/build8.data",

                codeUrl:
                  "Build/build8.wasm",


                /*
                 * Normal Unity files still come
                 * directly from jsDelivr.
                 */

                frameworkUrl:
                  CDN_BUILD_ROOT +
                  "build8.framework.js",

                streamingAssetsUrl:
                  STREAMING_ASSETS_ROOT,


                companyName:
                  "Banzai Project",

                productName:
                  "Unity WebGL Game",

                productVersion:
                  "1.9"
              },


              function(progress) {

                const percent =
                  Math.round(
                    progress * 100
                  );


                setStatus(
                  "status-engine",
                  `booting... ${percent}%`
                );
              }
            )


            .then(
              function(unityInstance) {

                window.unityInstance =
                  unityInstance;


                console.log(
                  "Unity started successfully"
                );


                setStatus(
                  "status-engine",
                  "done ✓",
                  true
                );


                document
                  .getElementById(
                    "statusDiv"
                  )
                  .className =
                    "hidden";


                document
                  .getElementById(
                    "overlayDiv"
                  )
                  .className =
                    "hidden";


                document
                  .getElementById(
                    "presplash"
                  )
                  .className =
                    "hidden";
              }
            )


            .catch(
              function(error) {

                console.error(
                  "Unity startup error:",
                  error
                );


                showError(
                  "Unity failed to start.",
                  error
                );
              }
            );
          };


        loaderScript.onerror =
          function(error) {

            console.error(
              "Failed to load loader:",
              error
            );


            showError(
              "Failed to load Unity loader script.",
              loaderUrl
            );
          };


        document.body.appendChild(
          loaderScript
        );
      }
    )


    .catch(
      function(error) {

        console.error(
          "Failed to merge game files:",
          error
        );


        showError(
          "Error loading game.",
          error
        );
      }
    );


    /*
     * Error UI
     */

    function showError(title, error) {

      const message =
        error &&
        error.message
          ? error.message
          : String(error);


      document
        .getElementById(
          "statusTextDiv"
        )
        .innerHTML =
          `
          <div style="
            color:#ff6666;
            word-break:break-word;
          ">
            ${escapeHtml(title)}
            <br>

            <small style="
              font-size:0.8rem;
              color:#ddd;
            ">
              ${escapeHtml(message)}
            </small>
          </div>
          `;


      document
        .getElementById(
          "statusDiv"
        )
        .className =
          "visible";
    }


    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );
    }

  </script>

</body>
</html>
